server:
  # 8082 已归生产管理后端（agri-production），两个服务原先都写 8082，本机只能起一个。
  # 8085 也是网关的虚拟主机端口，同样不能用；IoT 让到 8091（本机空闲，网关尚未登记它的 upstream）。
  port: 8091

# 物联网写接口的能力校验：调用核心平台内部接口（共享内部令牌）
agri:
  capability:
    check-url: "${CORE_CAPABILITY_CHECK_URL:http://localhost:8093/api/v1/internal/capability-check}"
    internal-token: "${AGRI_INTERNAL_TOKEN:agri-internal-dev}"

spring:
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 257MB
  application:
    name: agri-iot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      table-underline: true
      id-type: assign_id

services:
  masterdata:
    url: http://localhost:8083
  production:
    url: http://localhost:8092
  # 平台认证中心：RBAC 权限解析走它的 /api/v1/platform/permissions/mine
  platform:
    url: http://localhost:8093

# 运营端准入（平台 RBAC，V2.0 第 5.5 节）—— 组件来自 agri-common 的 com.agri.common.rbac。
#
# 现役物联用户端与运营端接口统一使用 /api/v1/iot/**，按路径和 HTTP 方法执行权限校验。
platform:
  rbac:
    operator-paths:
      - /api/v1/iot/app/**
      - /api/v1/iot/ops/**
    read-permission: iot:read
    write-permission: iot:write
    require-auth: true

logging:
  level:
    root: INFO
    com.agri.iot: DEBUG
    com.agri.iot.feign: DEBUG

# Unified probes: dependency failures affect readiness, not liveness.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: '*'
          exclude: livenessState

# 网关接入通过 iot.command.gateway-keys-json 配置每个网关独立的32位以上密钥。
# 接入端领取后必须持久化commandNo及dispatchToken，重启完成后回执；不得以领取成功代替重启成功。

# 托管文件需通过TLS网关暴露此路径；下载接入端携带X-Gateway-Id和X-Gateway-Key。
iot:
  firmware:
    storage-dir: ${IOT_FIRMWARE_STORAGE_DIR:data/firmware}
    public-base-url: ${IOT_FIRMWARE_PUBLIC_BASE_URL:}
    max-bytes: ${IOT_FIRMWARE_MAX_BYTES:268435456}
