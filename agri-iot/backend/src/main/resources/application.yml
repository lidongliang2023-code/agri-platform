server:
  # 8082 已归生产管理后端（agri-production），两个服务原先都写 8082，本机只能起一个。
  # 8085 也是网关的虚拟主机端口，同样不能用；IoT 让到 8091（本机空闲，网关尚未登记它的 upstream）。
  port: 8091

# 物联网写接口的能力校验：调用核心平台内部接口（共享内部令牌）
agri:
  capability:
    check-url: "${CORE_CAPABILITY_CHECK_URL:http://localhost:8093/api/v1/internal/capability-check}"
    internal-token: "${AGRI_INTERNAL_TOKEN:agri-internal-dev}"

spring:
  application:
    name: agri-iot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      table-underline: true
      id-type: assign_id

services:
  masterdata:
    url: http://localhost:8083
  production:
    url: http://localhost:8092
  # 平台认证中心：RBAC 权限解析走它的 /api/v1/platform/permissions/mine
  platform:
    url: http://localhost:8093

# 运营端准入（平台 RBAC，V2.0 第 5.5 节）—— 组件来自 agri-common 的 com.agri.common.rbac。
#
# IoT 后端整体是"管理面"（设备/分组/告警规则/自动化/场景都由运营与运维人员维护），
# 没有用户端与运营端的路径分界，所以这里按整个 /api/iot/** 要求 iot 权限：
#   · 读接口要 iot:read、写接口要 iot:write（拦截器按 HTTP 方法区分）；
#   · require-auth=true 是专门为这个服务开的：IoT 后端目前**没有任何认证层**
#     （SecurityConfig 里只有密码编码器；全模块搜不到 OncePerRequestFilter / HandlerInterceptor /
#     sa-token 的任何用法，也就是说 /api/iot/** 此前是对公网敞开的），若不在这里要求令牌，
#     运营接口等于裸奔。这是代码层面确认过的，不是推测。
#     其它子系统（交易/主数据）自己有认证层，保持默认 false 即可。
platform:
  rbac:
    operator-paths:
      - /api/iot/**
      - /api/v1/iot/app/**
      - /api/v1/iot/ops/**
    read-permission: iot:read
    write-permission: iot:write
    require-auth: true

logging:
  level:
    root: INFO
    com.agri.iot: DEBUG
    com.agri.iot.feign: DEBUG
