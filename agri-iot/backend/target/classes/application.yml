server:
  port: 8082

spring:
  application:
    name: agri-iot
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:agri-iot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      table-underline: true
      id-type: assign_id

services:
  masterdata:
    url: http://localhost:8081

logging:
  level:
    root: INFO
    com.agri.iot: DEBUG
    com.agri.iot.feign: DEBUG