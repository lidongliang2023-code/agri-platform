server:
  port: 8087

spring:
  application:
    name: agri-finance
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.agri.finance.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  token-name: satoken
  timeout: 86400000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

knife4j:
  enable: true
  openapi:
    title: 供应链金融模块API文档
    description: 农业产业互联网平台供应链金融模块接口文档
    version: 1.0.0
    contact:
      name: 技术支持
      email: support@agri-platform.com

logging:
  level:
    com.agri.finance: DEBUG
    org.springframework: INFO
