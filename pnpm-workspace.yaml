# 路线 2「先基建再拆」第一步：给跨子系统共享资产一个"家"。
#
# 成员纳入过程（2026-10-11，用户选定「以 pnpm 为唯一包管理器」）：
#   现有应用 agri-production/frontend 自本次起纳入 workspace。纳入会让 pnpm 重排它的
#   node_modules（hoisting 变化），因此必须成对执行「纳入 + 完整回归验证（tsc / build）」，
#   不允许只改本文件而跳过验证。
#
# 为什么用 pnpm：V2.0 第 4.3 节指定 pnpm 8（本机实测 pnpm 11.25.0，版本偏新但同族可用；
#   若要严格对齐 8.x，用 corepack 固定版本即可）。
packages:
  - 'packages/*'
  - 'agri-production/frontend'
# pnpm >=10 默认拦截依赖的构建脚本。esbuild 的 postinstall 负责把平台二进制就位，
# 被拦掉时 pnpm install 会直接以 ERR_PNPM_IGNORED_BUILDS 失败（已实测），vite 少了它跑不起来。
# 按「最小允许清单」只放 esbuild：以后新增依赖的构建脚本同样在此显式登记，而不是关掉整个机制。
allowBuilds:
  esbuild: true
