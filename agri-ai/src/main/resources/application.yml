server:
  port: ${SERVER_PORT:8201}

spring:
  application:
    name: agri-ai
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AI_MYSQL_URL:jdbc:mysql://localhost:3306/agri_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/ai-hub-migration
    table: ai_hub_schema_history
    baseline-on-migrate: true
    baseline-version: 0

sa-token:
  token-name: agri-token
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-body: false
  is-log: false

ai:
  tongyi:
    api-key: ${TONGYI_API_KEY:your-api-key}
    base-url: ${TONGYI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${TONGYI_MODEL:qwen-turbo}
  openai:
    api-key: ${OPENAI_API_KEY:your-api-key}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  provider: ${AI_PROVIDER:tongyi}
  real-inference-enabled: ${AI_REAL_INFERENCE_ENABLED:true}
  fallback-to-rule-template: ${AI_FALLBACK_TO_RULE_TEMPLATE:true}
  connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
  request-timeout-ms: ${AI_REQUEST_TIMEOUT_MS:45000}

logging:
  level:
    com.agri.ai: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: '*'
          exclude: livenessState

services:
  platform:
    url: ${PLATFORM_URL:http://localhost:8093}
