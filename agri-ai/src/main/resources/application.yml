server:
  port: ${SERVER_PORT:8201}

spring:
  application:
    name: agri-ai
  profiles:
    active: dev

# 产业互联网平台统一登录 (Sa-Token 配置)
sa-token:
  token-name: agri-token
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-body: false
  is-log: false

ai:
  tongyi:
    api-key: ${TONGYI_API_KEY:your-api-key}
    base-url: https://dashscope.aliyuncs.com/api/v1
  openai:
    api-key: ${OPENAI_API_KEY:your-api-key}
    base-url: https://api.openai.com/v1
  provider: tongyi

logging:
  level:
    com.agri.ai: INFO

# Unified probes: dependency failures affect readiness, not liveness.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: '*'
          exclude: livenessState
