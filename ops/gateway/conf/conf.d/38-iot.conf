# 本机固件验收TLS入口；正式网关接入需更换可信证书与可达域名。
server {
    listen 127.0.0.1:8443 ssl;
    server_name localhost;
    ssl_certificate C:/Users/71502/agri-gw/conf/firmware-tls/localhost.crt;
    ssl_certificate_key C:/Users/71502/agri-gw/conf/firmware-tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /api/v1/iot/gateway-channel/firmware/ {
        proxy_pass http://iot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
