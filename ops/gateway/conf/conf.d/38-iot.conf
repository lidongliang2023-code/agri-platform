# 物联网管理模块：用户端与运营端分别使用独立端口、独立版本指针。

server {
    listen 8101;
    server_name iot.agri.local localhost 127.0.0.1 192.168.0.106;
    root bucket;

    location = /iot-web/index.html { add_header Cache-Control "no-store" always; }
    location = /iot-web/manifest.json { add_header Cache-Control "no-store" always; }
    location /iot-web/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/platform/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://iot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri /iot-web/index.html; }
}

server {
    listen 8102;
    server_name iot-admin.agri.local localhost 127.0.0.1 192.168.0.106;
    root bucket;

    # 固件上传单独放宽；普通接口维持原请求大小限制。
    location = /api/v1/iot/ops/firmware/packages/upload {
        client_max_body_size 257m;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://iot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /iot-admin/index.html { add_header Cache-Control "no-store" always; }
    location = /iot-admin/manifest.json { add_header Cache-Control "no-store" always; }
    location /iot-admin/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/auth/ {
        proxy_pass http://core_platform;
