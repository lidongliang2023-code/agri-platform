# AI中台管理端：静态资源与AI服务同包发布，统一认证接口由网关转发。
server {
    listen 8116;
    server_name ai-ops.agri.local localhost 127.0.0.1;
    client_max_body_size 64k;
    location /api/v1/sso/ { proxy_pass http://core_platform; proxy_set_header Host $host; }
    location /api/v1/auth/ { proxy_pass http://core_platform; proxy_set_header Host $host; }
    location /api/v1/platform/ { proxy_pass http://core_platform; proxy_set_header Host $host; }
    location = / { return 302 /ai-ops/; }
    location = /ai-ops { return 302 /ai-ops/; }
    location = /ai-ops/ { proxy_pass http://127.0.0.1:8201/ai-ops/index.html; add_header Cache-Control "no-store" always; }
    location = /sso/callback { proxy_pass http://127.0.0.1:8201/ai-ops/index.html; add_header Cache-Control "no-store" always; }
    location /ai-ops/ { proxy_pass http://127.0.0.1:8201; add_header Cache-Control "no-store" always; }
    location /api/ai/ { proxy_pass http://127.0.0.1:8201; proxy_set_header Host $host; proxy_read_timeout 60s; }
    location / { return 404; }
}
