# 用户中心运营端（agri-sso/ops）：:8115。
#
# 为什么单独一个 server 而不是挂在 8090（SSO 登录页）下：
#   8090 是对外登录入口，任何未登录用户都会访问；运营端是内部管理面，
#   混在一起会让"登录页"和"后台"共用一个域名与端口，权限与审计边界糊掉。
#
# 后端只有 core-platform 一个上游：用户 / 角色 / 身份 / 实名 / 资质 / 组织 / 反馈 /
# 隐私请求 / 操作日志全部在 /api/v1/admin/** 下，本运营端不直连任何业务子系统。
server {
    listen 8115;
    server_name user-center-ops.agri.local localhost 127.0.0.1 192.168.0.106;
    root bucket;

    location = /user-center-ops/index.html { add_header Cache-Control "no-store" always; }
    location = /user-center-ops/manifest.json { add_header Cache-Control "no-store" always; }
    location /user-center-ops/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # 运营端的全部业务接口：admin（用户/角色/审核/配置）+ uc（用户中心专属）
    location /api/v1/admin/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 统一登录（PKCE 换令牌 / 刷新 / 登出）
    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 权限码读取（/platform/permissions/mine），前端用它判断能不能进这个运营端
    location /api/v1/platform/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri /user-center-ops/index.html; }
}
