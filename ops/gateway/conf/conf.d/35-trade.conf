# 交易撮合平台（trade）—— 本地形态
#
# 生产：trade.agri-platform.com:443（PRD V6.0 第 1.1 节：独立域名 / 独立部署 / 独立流水线）。
# 本地听 :8086 —— 80 prod、8080 mdm、8081 finance、8082 mall-consumer、8084 mall-supplier、
# 8085 mall-channel、8090 sso 都已占用；8086 在本网关里是空位。
server {
    listen 8086;
    server_name trade.agri.local 127.0.0.1 localhost;

    root bucket;

    location = /trade/index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /trade/manifest.json {
        add_header Cache-Control "no-store" always;
    }
    location /trade/versions/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 业务接口 → 交易后端（agri-trade 注册的接口族是 /api/trade/**）
    location /api/trade/ {
        proxy_pass http://trade_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 平台认证端点必须落到 core-platform，而不是交易后端。
    # nginx 按最长前缀匹配，/api/v1/sso/ 比 /api/ 长，所以不会被下面那条抢走；
    # 显式写出来是为了让"认证归认证、业务归业务"这条边界在配置里看得见。
    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 平台级身份配置（用户-经营主体绑定）—— 数据与接口都归 core-platform，
    # 不是交易模块的接口，所以不能落到下面那条 trade_backend 兜底里。
    # 用精确前缀 /api/v1/admin/user-merchants：core-platform 的 /api/v1/admin/** 下
    # 还有其它模块的管理接口，不整段放行。
    location /api/v1/admin/user-merchants {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 当前用户的角色与权限码（RBAC 实时鉴权）—— 平台侧接口。
    # 交易后端自己也会经 Feign 调它（运营端准入判定），这里开出来是给前端用的：
    # 用户端/运营端据此决定"这个人能不能看到运营端入口"。
    location /api/v1/platform/permissions/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 个人实名认证（当事人提交 / 查自己）—— 平台侧接口，同属 core-platform。
    location /api/v1/platform/identity/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 个人实名认证审核（运营端）—— 同样是平台侧接口，用精确前缀而不是整段放行 /api/v1/admin/。
    location /api/v1/admin/user-identities {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 经营主体认证（运营端）与主体列表 —— 同样是平台侧接口，不是交易模块的。
    # 与上面那条 user-merchants 一样用精确前缀，不整段放行 /api/v1/admin/。
    location /api/v1/admin/merchant-certifications {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/admin/merchants {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 这里刻意**没有** location /admin/。
    #
    # 运营端的接口曾经映射在 /admin/trade/**（与前端页面路由同一前缀），当时这条路由是缺的，
    # 后果很隐蔽：/admin/trade/order/page 没有匹配的 location，掉进最下面的 location /
    # 兜底、返回 index.html —— **HTTP 200**、内容是 HTML。前端拿 res.code 判断永远不通过，
    # 于是每个运营端页面都稳定显示"0 条"，而网络面板里全是 200。
    #
    # 修法是让接口回到本模块的接口族：AdminTradeController 已改为 /api/trade/admin/**，
    # 由上面的 location /api/trade/ 一起覆盖。这样两条规则互补且不会互相踩：
    #   /api/**   → 后端（永远不返回页面）
    #   其它      → SPA（/admin/trade/xxx 刷新页面也能正常回到前端路由）
    # 其余 /api/* 也归交易后端（存量路径的兜底）
    location /api/ {
        proxy_pass http://trade_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 同 mdm：不带 $uri/ 候选，避免站点根命中目录后 403
    location / {
        try_files $uri /trade/index.html;
    }
}
