# 上游：目前只有 core-platform（模块化单体，含认证与各业务域）
# 拆微服务后，这里会变成多个 upstream，server 块里的 location 随之细分。
#
# 文件名带 10 前缀的原因：conf.d/*.conf 按字典序加载，上游必须排在引用它的 server 块之前。
upstream core_platform {
    # 本地运行后端时的端口。换端口只改这一行。
    server 127.0.0.1:8093;
    keepalive 16;
}

# 主数据域后端（satellite / 独立服务）。本地未运行时表现为 502，属预期。
upstream mdm_backend {
    server 127.0.0.1:8083;
}

# 交易撮合域后端（satellite / 独立服务，agri-trade）。端口 8089 ——
# 8084 已被本网关的 mall-supplier 虚拟主机占用，后端不能与网关抢同一个口。
upstream trade_backend {
    server 127.0.0.1:8089;
}

# 供应链金融后端（取自 agri-finance/frontend/vite.config.js 里它自己的 dev 代理目标，保持一致）
upstream finance_backend {
    server 127.0.0.1:8087;
}

# S2B2C 各端共用一份后端（取自 agri-s2b2c/frontend-*/vite.config.js 的 dev 代理目标）
upstream s2b2c_backend {
    server 127.0.0.1:8088;
}

# 生产管理域后端（agri-production，卫星服务；库是它自己的 agri_production）。
#
# **当前 prod 子域还没切到这里**：20-prod.conf 里 /api/v1/production/ 仍指向 core_platform。
# 原因是实测（scripts/probe-frontend-api.mjs）：前端会发出的 311 条请求里，有 226 条
# agri-production 还没有处理器 —— 现在切会碎掉约四分之三的页面。
# 先把 upstream 定义好，切流时只改 20-prod.conf 里那一行 proxy_pass。
upstream agri_production {
    server 127.0.0.1:8092;
}
