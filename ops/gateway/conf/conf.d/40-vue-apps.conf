# Vue 3 系的四个子系统前端 —— 本地形态
#
# 它们与 prod/mdm 的差别只在栈（无 TS、无 antd，共享通道是设计令牌的 CSS 变量投影），
# 网关侧的处理完全一样：桶根 + 版本指针 + 同域 /api + SPA 回退。
#
# **本地端口约定**：生产环境是「一个 443 + 按子域分流」，本地为了**不改 hosts 也能直接点开**，
# 每个子系统各占一个端口（:80 prod、:8080 mdm、:8081 finance、:8082/8084/8085 商城三端）。
# 子域名（finance.agri.local 等）同样可用，用 `curl -H "Host: …"` 即可按生产口径复核。
# 代价是每个端口都要有自己的 default_server 兜底（见 00-default.conf）——
# 那是本地约定的产物，不是生产形态：生产只有一个监听端口，一个默认 server 就够。

server {
    listen 8081;
    server_name finance.agri.local 127.0.0.1 localhost;

    root bucket;

    location = /finance/index.html { add_header Cache-Control "no-store" always; }
    location = /finance/manifest.json { add_header Cache-Control "no-store" always; }
    location /finance/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    location /api/ {
        proxy_pass http://finance_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri /finance/index.html; }
}

