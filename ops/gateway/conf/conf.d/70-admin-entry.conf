# 运营端独立入口（生产管理系统 · 运营端）
#
# 背景：同一个前端产物里同时承载用户端（/production/*）与运营端（/admin/production/*）。
# 两端让用户记同一个根地址再挑路径，实际用起来是"进门先撞墙"——尤其运营人员只干运营的活。
# 这里在独立端口上开一个入口，根路径直接落到运营端登录页。
#
# 与 prod vhost 的关系：桶与版本指针**完全共用**（同一份产物、同一个指针），
# 只有"根路径去哪"不同。所以这不是第二套部署，只是第二个入口 —— 回滚与版本指针仍然只有一处。
server {
    listen 8190;
    server_name admin.agri.local 127.0.0.1 localhost;

    root bucket;

    # 运营端入口：根路径直接进运营端登录页（该页面自身按 SSO 闸门决定是否跳统一认证中心）
    location = / {
        return 302 /admin/login;
    }

    location = /prod/index.html { add_header Cache-Control "no-store" always; }
    location = /prod/manifest.json { add_header Cache-Control "no-store" always; }
    location /prod/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # /api 交给 **prod vhost（:80）**处理，本入口不再自己决定 API 去哪。
    #
    # 为什么不能直接 proxy_pass http://core_platform（本文件原先就是这么写的，2026-10-15 修）：
    # prod vhost 里的"按段切流"矩阵（plans/inputs/tasks/quality/harvests/trace/blockchain/
    # messages/members + 运营端 admin/各域 + food-safety 四个子域）只存在于 :80 那份 server 块里。
    # 从 :8190 打开运营端时，所有已经切到 agri-production 的段都会被绕过去读**平台库**，
    # 于是同一个页面在两个入口看到的是**两份数据**，而且 :8190 的响应里连 X-Served-By 都没有
    # （实测：:80 是 agri-production，:8190 无该响应头）—— 运维按响应头排查时会直接看瞎。
    #
    # 用回环代理而不是把那些 location 复制过来：复制等于把切流矩阵变成两份，
    # 以后每切一段都要记得改两个地方，漏一个就又是"两个入口两份数据"。回环这一跳代价极小，
    # 换来的是**路由只有一处**。Host 必须改写成 prod vhost 认得的名字（它只认
    # prod.agri.local / localhost / 127.0.0.1），否则会落到 00-default.conf 的 404。
    #
    # 长期更干净的做法是把 :80 那套 /api 路由抽成 conf/snippets/*.inc 由两个 server 块 include，
    # 那是一次独立的结构调整（要整体搬 300 多行 location），不在本次"把两个入口跑成同一份"的范围内。
    location /api/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri /prod/index.html; }
}
