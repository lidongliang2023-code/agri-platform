# 农产云官网门户（portal）—— 本地形态
#
# 生产环境建议独立域名（www / portal 子域）；本地用 :8098 与路径 /portal/ 双入口：
#   · http://localhost:8098/         -> 302 /portal/
#   · http://localhost:8098/portal/  -> 官网首页
#
# 门户是公开站点，不需要登录；商品/行情数据从交易域读取，交易服务未启动时前端回退
# 到原型示例数据并明确标注，不把示例值当成真实成交。
server {
    listen 8098;
    server_name portal.agri.local localhost 127.0.0.1;

    root bucket;

    location = / {
        return 302 /portal/;
    }

    location = /portal {
        return 301 /portal/;
    }

    location = /portal/index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /portal/manifest.json {
        add_header Cache-Control "no-store" always;
    }
    location /portal/versions/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 门户的货源/行情读取交易域；交易服务未启动时返回 502，前端会回退示例数据并标注。
    location /api/trade/ {
        proxy_pass http://trade_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 认证与平台域（登录、注册、认证资料）仍归 core-platform。
    location /api/v1/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hash 路由：静态文件命中即返回，其余路径回退门户入口。
    location /portal/ {
        try_files $uri /portal/index.html;
    }

    location / {
        return 302 /portal/;
    }
}
