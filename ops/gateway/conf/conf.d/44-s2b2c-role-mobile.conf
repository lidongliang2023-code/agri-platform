# S2B2C 供应商端 / 渠道商端移动应用 H5 入口。
# 同一份 uni-app 源码可分别编译为微信小程序和 App。
server {
    listen 8183;
    server_name supplier-mobile.agri.local localhost 127.0.0.1 192.168.0.106;
    root bucket;

    location = /mall-supplier-mobile/index.html { add_header Cache-Control "no-store" always; }
    location = /mall-supplier-mobile/manifest.json { add_header Cache-Control "no-store" always; }
    location /mall-supplier-mobile/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/platform/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://s2b2c_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri /mall-supplier-mobile/index.html; }
}

