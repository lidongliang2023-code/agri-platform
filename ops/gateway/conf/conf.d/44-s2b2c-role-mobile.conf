# S2B2C 渠道商移动应用 H5 入口。
# 供应商移动端已停用，供应商功能统一收敛到平台运营端供货工作台。
server {
    listen 8184;
    server_name channel-mobile.agri.local localhost 127.0.0.1 192.168.0.106;
    root bucket;

    location = /mall-channel-mobile/index.html { add_header Cache-Control "no-store" always; }
    location = /mall-channel-mobile/manifest.json { add_header Cache-Control "no-store" always; }
    location /mall-channel-mobile/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # uni-app tabBar 使用 ./static/，从根入口访问时需映射到当前版本静态目录。
    location ^~ /static/ {
        rewrite ^/static/(.*)$ /mall-channel-mobile/static/$1 last;
    }
    location ^~ /mall-channel-mobile/static/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/platform/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://s2b2c_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri /mall-channel-mobile/index.html; }
}
