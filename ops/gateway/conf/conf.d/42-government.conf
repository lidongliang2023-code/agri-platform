# 政府监管用户端、移动执法端与运营端。

server {
    listen 8108;
    server_name gov.agri.local localhost 127.0.0.1 192.168.0.106;
    root bucket;

    location = /gov/index.html { add_header Cache-Control "no-store" always; }
    location = /gov/manifest.json { add_header Cache-Control "no-store" always; }
    location /gov/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    location /api/v1/government/ {
        proxy_pass http://government_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/platform/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/ { proxy_pass http://core_platform; proxy_set_header Host $host; }
    location / { try_files $uri /gov/index.html; }
}

