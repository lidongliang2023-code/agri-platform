# 信息资讯：用户端（:8104 /info/）与运营端（:8113 /info-ops/）是 agri-info 的两个独立产物，
# 后端同属 agri-info（:8096），与综合服务（agri-service，:8094）互不替代。
#
# 注意：/api/v1/info/ 必须排在 /api/v1/ 兜底之前，否则会被错误转发到 core-platform。

server {
    listen 8104;
    server_name info.agri.local localhost 127.0.0.1 192.168.0.106;
    root bucket;

    location = /info/index.html { add_header Cache-Control "no-store" always; }
    location = /info/manifest.json { add_header Cache-Control "no-store" always; }
    location /info/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # 培训课程视频：只接受 agri-info 签发的短时签名地址（secure_link）。
    # 签名原文 = <过期时间戳><URI><空格><密钥>，必须与后端 VodSigner 完全一致。
    # 过期返回 410（不是 403）—— 播放器据此区分"地址过期"与"无权限"，前者自动换票续播。
    # 本 location 在 8104 / 8113 / 8114 三处必须逐字一致，改一处就要同步另两处。
    location /vod/ {
        root .;
        # 顺序不能反：第一个参数是签名，第二个才是过期时间。
        # 写成 $arg_e,$arg_s 会让 nginx 把时间戳当签名校验，结果一律 403。
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires$uri agri-vod-dev-secret";
        if ($secure_link = "")  { return 403; }
        if ($secure_link = "0") { return 410; }
        add_header Cache-Control "private, max-age=600" always;
    }

    # 信息资讯域独立 API：行情、资讯、供需、AI、培训、报告、存证、预警订阅。
    location /api/v1/info/ {
        proxy_pass http://info_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/sso/ { proxy_pass http://core_platform; proxy_set_header Host $host; }
    location /api/v1/auth/ { proxy_pass http://core_platform; proxy_set_header Host $host; }
    location /api/v1/platform/ { proxy_pass http://core_platform; proxy_set_header Host $host; }
    location /api/trade/ { proxy_pass http://trade_backend; proxy_set_header Host $host; }
    location /api/v1/ { proxy_pass http://core_platform; proxy_set_header Host $host; }
    location / { try_files $uri /info/index.html; }
}

# 信息资讯运营端（独立管理应用）：:8113。
server {
    listen 8113;
    server_name info-ops.agri.local localhost 127.0.0.1 192.168.0.106;
    root bucket;

    location = /info-ops/index.html { add_header Cache-Control "no-store" always; }
    location = /info-ops/manifest.json { add_header Cache-Control "no-store" always; }
    location /info-ops/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # 培训课程视频：只接受 agri-info 签发的短时签名地址（secure_link）。
    # 签名原文 = <过期时间戳><URI><空格><密钥>，必须与后端 VodSigner 完全一致。
    # 过期返回 410（不是 403）—— 播放器据此区分"地址过期"与"无权限"，前者自动换票续播。
    # 本 location 在 8104 / 8113 / 8114 三处必须逐字一致，改一处就要同步另两处。
    location /vod/ {
        root .;
        # 顺序不能反：第一个参数是签名，第二个才是过期时间。
        # 写成 $arg_e,$arg_s 会让 nginx 把时间戳当签名校验，结果一律 403。
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires$uri agri-vod-dev-secret";
        if ($secure_link = "")  { return 403; }
        if ($secure_link = "0") { return 410; }
        add_header Cache-Control "private, max-age=600" always;
    }

    # 视频上传单独放行大体积请求：nginx 默认 1MB，几百 MB 的课程视频会被直接拒掉。
    # 只对运营端开放，且路径前缀比 /api/v1/info/ 更长，优先匹配。
    location /api/v1/info/ops/media/ {
        client_max_body_size 2048m;
        client_body_timeout 600s;
        proxy_pass http://info_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location /api/v1/info/ {
        proxy_pass http://info_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/platform/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri /info-ops/index.html; }
}

