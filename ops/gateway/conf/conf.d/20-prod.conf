# 生产管理系统（prod）—— 本地形态
#
# 生产环境的 server_name 应为 prod.agri-platform.com；本地用 agri.local 后缀（见《网关与域名规划》第一节）。
# 这里额外挂了 localhost / 127.0.0.1：这样**不用改 hosts** 也能在浏览器里验证同一套路由，
# 而 Host 路由本身仍可用 `curl -H "Host: prod.agri.local"` 单独验到（未注册 Host 由 00-default.conf 返回 404）。
server {
    listen 80;
    server_name prod.agri.local localhost 127.0.0.1;

    # 桶根：<app>/index.html 是当前版本指针，<app>/versions/<v>/ 是不可变产物
    root bucket;

    # 入口与清单必须短缓存：否则切了版本指针，用户仍旧拿到旧入口（V2.0 4.7 的灰度前提）
    location = /prod/index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /prod/manifest.json {
        add_header Cache-Control "no-store" always;
    }

    # 版本目录内容不可变，可以长缓存
    location /prod/versions/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 前端与 API 同域（《网关与域名规划》第二节约定 1）：/api 走上游，其余按 SPA 规则回退。
    # 同域的意义是浏览器侧没有跨域、Cookie 作用域最简 —— 上一轮的 HttpOnly 刷新令牌正是靠这条约定
    # 才能在开发期不经任何 CORS 配置就工作。

    # ---------------------------------------------------------------------
    # 统一认证与平台域：**永远**走 core-platform。
    #
    # 这三段显式写出来，而不是靠"/api/ 恰好指向 core_platform"这个巧合：
    # 生产域一旦切到独立的 agri-production，这几段仍必须留在平台侧 ——
    # agri-production 没有 /api/v1/auth（实测 404），切流当天登录会跟着一起断；
    # /api/v1/admin 是平台域（角色、权限、租户绑定），从来不属于生产域。
    # 前缀 location 之间按"最长匹配"生效，与书写顺序无关。
    # ---------------------------------------------------------------------
    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/admin/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # 生产域（/api/v1/production/**）——**已切到 agri-production，未迁完的路径回退平台侧**。
    #
    # 为什么不是"整段一次切干净"：实测（scripts/probe-frontend-api.mjs，可复跑）
    # 前端 api 层共发出 311 条去重请求，agri-production 目前覆盖 114 条、**还有 197 条没有处理器**。
    # 硬切会碎掉一大半页面；而"等归零再切"等于这一整段长期停留在平台侧、迁移没有可见进展。
    #
    # 折中办法（本配置采用的）：先切，缺的自动回退。
    #   · agri-production 有处理器 → 由它服务（返回带 X-Served-By: agri-production）；
    #   · agri-production 没有这个处理器 → 它返回 **HTTP 404**，这里把请求原样交给 core-platform
    #     （返回带 X-Served-By: core-platform-fallback），页面照旧。
    #   · 判定依据是 **HTTP 404** 而不是响应体里的 code：本平台业务上的"找不到"一律是
    #     HTTP 200 + body.code=404，只有"没有这个处理器"才是 HTTP 404，所以不会误触发。
    #
    # 两个必须知道的后果：
    #   1. **迁移期会有两个数据源**：被服务的路径来自 agri_production 库，回退的路径来自
    #      core_platform 的 agri_core 库，两边的演示数据是两套（"示范农场" vs "DEMO-FARM-001"）。
    #      同一个页面上混着两套数据的字段（例如投入品的档案来自新服务、负责人下拉来自平台侧），
    #      这是迁移中的正常状态，不是错数据 —— 每个值都真实、可追溯，但不要据此判断"哪个是准的"。
    #   2. 想知道某个请求是谁服务的：看响应头 **X-Served-By**。想知道还差多少条没迁：
    #      把 probe 脚本指向 http://localhost:80/api/v1/production（经网关）与 http://localhost:8092
    #      （直连新服务）各跑一次，两者之差就是还在回退的条数。
    #
    # 回退**只认 404**：新服务挂了是 502，不会静默回退 —— 后端真挂了要响得出来，
    # 而不是让平台侧默默兜住、看起来一切正常。
    #
    # 回滚：把下面 location 里的 proxy_pass 改回 http://core_platform; 并去掉
    # proxy_intercept_errors / error_page 两行即可，一处改动、不涉及其它子域。
    # ---------------------------------------------------------------------
    location /api/v1/production/ {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    # 生产域里 agri-production 还没实现的路径，原样交给平台侧（迁移期的兜底）
    location @prod_platform_fallback {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By "core-platform-fallback" always;
    }

    # 其余 /api（平台侧通用路径等）继续走 core-platform
    location /api/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 回退：前端路由（/admin/... 等）在服务端并不存在对应文件，交给指针指向的 index.html 自行处理。
    # 刻意**不写** `$uri/` 这个候选：根路径 `/` 会命中桶目录本身（是个目录），再走目录索引——
    # 而本配置没有 `index` 指令，结果是 403（目录索引禁止），站点根直接打不开。
    # 只用 `$uri` 做文件匹配，目录一律落到入口文件。
    location / {
        try_files $uri /prod/index.html;
    }
}
