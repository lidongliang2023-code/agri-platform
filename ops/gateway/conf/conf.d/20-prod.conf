# 生产管理系统（prod）—— 本地形态
#
# 生产环境的 server_name 应为 prod.agri-platform.com；本地用 agri.local 后缀（见《网关与域名规划》第一节）。
# 这里额外挂了 localhost / 127.0.0.1：这样**不用改 hosts** 也能在浏览器里验证同一套路由，
# 而 Host 路由本身仍可用 `curl -H "Host: prod.agri.local"` 单独验到（未注册 Host 由 00-default.conf 返回 404）。
server {
    listen 80;
    server_name prod.agri.local localhost 127.0.0.1;

    # 桶根：<app>/index.html 是当前版本指针，<app>/versions/<v>/ 是不可变产物
    root bucket;

    # 入口与清单必须短缓存：否则切了版本指针，用户仍旧拿到旧入口（V2.0 4.7 的灰度前提）
    location = /prod/index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /prod/manifest.json {
        add_header Cache-Control "no-store" always;
    }

    # 版本目录内容不可变，可以长缓存
    location /prod/versions/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 前端与 API 同域（《网关与域名规划》第二节约定 1）：/api 走上游，其余按 SPA 规则回退。
    # 同域的意义是浏览器侧没有跨域、Cookie 作用域最简 —— 上一轮的 HttpOnly 刷新令牌正是靠这条约定
    # 才能在开发期不经任何 CORS 配置就工作。

    # ---------------------------------------------------------------------
    # 统一认证与平台域：**永远**走 core-platform。
    #
    # 这三段显式写出来，而不是靠"/api/ 恰好指向 core_platform"这个巧合：
    # 生产域一旦切到独立的 agri-production，这几段仍必须留在平台侧 ——
    # agri-production 没有 /api/v1/auth（实测 404），切流当天登录会跟着一起断；
    # /api/v1/admin 是平台域（角色、权限、租户绑定），从来不属于生产域。
    # 前缀 location 之间按"最长匹配"生效，与书写顺序无关。
    # ---------------------------------------------------------------------
    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/admin/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # 生产域（/api/v1/production/**）——**按已验收的路径段逐段切**，其余仍走平台侧。
    #
    # 为什么不整段切：实测（scripts/probe-frontend-api.mjs，可复跑）前端 api 层共发出
    # 311 条去重请求，agri-production 目前只覆盖 114 条 —— 整段切会碎掉一大半页面。
    #
    # 为什么 "整段切 + 404 回退" 也不行（这一版先试过，实测抓到 7 条回归）：
    #   agri-production 里 /plots/{id}、/farms/{id}、/iot/devices/{id}、/admin/farms/{id}、
    #   /admin/tenants/{id} 这些 **{id} 处理器会把字面量路径吃掉** —— /plots/stats、/farms/all、
    #   /iot/devices/offline、/admin/farms/map（compliance / cert-expiring 同理）本来是平台侧正常服务的，
    #   切过去之后变成 "参数类型不匹配: id"（HTTP 400）。回退规则只认 404，接不住 400，
    #   于是这 7 条从"正常"变成"报错"。而这 7 条里 /plots/stats 是首页看板在用的。
    #
    # 所以口径定为：**只把按页验收过的段切过来**，段内再留 404 回退兜底（同段里仍可能有
    # 个别未实现的端点）。每做完一页，满足两条判据后往下面正则里加一个词：
    #   ① probe 脚本指向网关时，该段"缺口 0"；② 对照脚本（经网关 vs 直连 core-platform）回归 0。
    #
    # 已验收并切入：plans（种养计划）、inputs（农资投入品）、tasks（农事任务）、quality（质量检测）、
    # harvests（采收批次与成品库存）、trace（溯源码与全链路）、blockchain（存证台账与验真）。
    #
    # trace / blockchain 两段是 2026-10-15 加的，判据同样是那两条：
    #   ① probe 指向新服务：两段"缺处理器 0"（trace 3 成功 / 9 有处理器未成功，blockchain 3 成功 / 5 同上）；
    #   ② 切后跑 diff-cutover-regressions.mjs：无"新服务非 0 而平台侧 0"的路径。
    # 这两段之所以必须切过去：存证的**写路径**（提交/存证/重试/验真）只在新服务里，留在平台侧
    # 页面上的"提交存证""重试""按业务单号验真"会打到平台侧旧实现上 —— 接口返回 200、功能不可用，
    # 正是最不该出现的那种"看起来没坏"。
    #
    # ⚠️ 将来切 `/admin/**`（运营端）时**必须把 /admin/tenants 排除在外**：
    # 租户/市场主体是平台域数据（库在 agri_core），本服务的口径是"一主体一租户"（租户由平台下发），
    # 生产服务不拥有租户主数据。agri-production 早先那套 Tenant 控制器对应的表
    # （agri_prod_tenant_info）**根本不存在**，5 个接口一调就是 500 —— 2026-10-15 已连同脚手架删除；
    # 扫雷脚本把这一族路径列进"不计入缺口的平台域路径"（scripts/probe-frontend-api.mjs），
    # 免得"该段缺口归零"这条判据永远达不到。
    # 运维观察：响应头 **X-Served-By** 说明每个请求是谁服务的（agri-production /
    # core-platform-fallback / core-platform）。
    #
    # 回退**只认 404**：新服务挂了是 502，不静默兜底 —— 后端真挂了要响得出来。
    # 回滚：把下面这行的 proxy_pass 换成 http://core_platform;（或把段名从正则里去掉）即可，
    # 一处改动、不涉及其它子域。
    # ---------------------------------------------------------------------
    location ~ ^/api/v1/production/(plans|inputs|tasks|quality|harvests|trace|blockchain)(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    # 生产域里 agri-production 还没实现的路径，原样交给平台侧（迁移期的兜底）
    location @prod_platform_fallback {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By "core-platform-fallback" always;
    }

    # ---------------------------------------------------------------------
    # 运营端「溯源监管」—— **单独一条 location**，不能并进上面那条正则。
    #
    # 上面那条匹配的是 `/api/v1/production/(段名)`，而运营端路径是
    # `/api/v1/production/admin/trace/**`（admin 在前），并进同一段会连
    # /admin/tenants 一起带走 —— 而租户属平台域、本服务**不实现**
    # （见本文件上面关于 /admin/tenants 的说明）。所以运营端按域**逐块**加：
    # 谁的域切完了，就给谁单开一条 location。
    #
    # 已验收并入：admin/trace、admin/quality（2026-10-15）。判据同样是两条：
    #   ① probe 指向新服务：admin/trace 缺口 0（2 条"有处理器未成功"是空体探针被校验拦下，属正常）；
    #   ② 切后跑 diff-cutover-regressions：无"新服务非 0 而平台侧 0"的**实质**路径。
    # 这一块必须切过去的理由：一键召回在平台侧只冻结批次、不作废码
    # （core-platform 的 AdminTraceService 里有"只冻结、不作废"的半生效记录），
    # 而本服务两个动作在同一个事务里做。
    # 回滚：把这一段的 proxy_pass 换成 http://core_platform; 即可。
    # ---------------------------------------------------------------------
    location ~ ^/api/v1/production/admin/trace(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    # 运营端「质量监管」—— 同样单独一条（理由同上，不能并进生产域正则）。
    # 检测机构管理 / 检测台账 / 检测报告管理 / 不合格品处置 四个页面都在这一块下。
    location ~ ^/api/v1/production/admin/quality(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    # 运营端「生产监控」—— 同样单独一条。
    # 三个页面：生产监控中心 / IoT设备监控 / 任务执行监控。
    location ~ ^/api/v1/production/admin/monitor(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    # 运营端「异常告警」—— 整段切。
    #
    # 切之前必须先做的两件事（2026-10-15 做完才切的，否则会切出问题）：
    #   ① **把演示告警迁过来**：本表 agri_prod_alert_record 原先是空的，而 core 侧有 20 条演示告警 ——
    #      直接切，页面会从"有数据"变成"空列表"（schema-patch-alert-demo.sql）；
    #   ② **把告警列表端点换成页面要的形状**：agri-production 里原先那个 GET /admin/alerts
    #      返回裸数组且只查 pending，而页面按 PageResult<Alert> 消费 —— 换了表数据也渲染不出来。
    #      已由 AdminAlertController 的 GET /admin/alerts 取代（分页 + 数字编码筛选 + AlertVO 形状）。
    #
    # 另外两块本来就是坏的，切过来才修好：core 的 /emergency 与 /review 返回的是**告警**，
    # 而页面按**预案**与**复盘**的字段渲染，字段全是 undefined。
    # 运营端「知识库」与「SOP 规程库」—— 两块一起切（页面在同一个菜单组下）。
    # 切之前先把内容表与演示数据搬过来（schema-patch-knowledge-sop.sql）：
    # 这两块此前只存在于平台侧，本服务一张表都没有，直接切会从"有数据"变"空列表"。
    # 知识库的删除端点也实现了 —— 页面有删除按钮，而 DELETE 探针默认不发（会被跳过），
    # 不实现就会 404、回退到平台侧执行：平台侧删的是它自己的表，页面显示"删除成功"而本库行还在。
    # 运营端「运营仪表盘」—— 六条聚合全部按本服务的表重写（平台侧那份 27KB 的聚合是按 agri_core
    # 的字段与主键写的，口径不通）。切之前先把演示数据的空缺补上（schema-patch-demo-areas.sql）：
    # 演示农场与地块的面积/所在地一直是空的，不补的话「在田面积」「种植面积排行」恒为 0、
    # 区域分布只剩一个"未标注区域"—— 那不是聚合写错，是数据本身空。
    # 运营端「统计报表」—— 整段切（本服务实现了页面会调的全部五条）。
    # /stat 在平台侧是被吞掉的：core 没有这个端点，请求会被 @GetMapping("/{id}") 接走当"报表编号=stat"查，
    # 必然 404（页面对此写了降级提示）。切过来之后报表中心那三张卡片才有真数。
    # 运营端「审批管理」—— 整段切。
    # 切之前先把审批单与**流程配置**搬过来（schema-patch-approvals.sql）：审批单此前只在平台侧，
    # 而流程配置在平台侧**根本没有表**（core 的 /config 返回三个硬编码骨架，页面却是带完整增删改的）。
    # 另外页面用的是 PATCH approve / PATCH batch-approve，而平台侧实现的是 POST —— 也就是说
    # 页面上那个"审批通过"按钮在平台侧一直不匹配；切过来才真的能审批。
    # 运营端「食品安全」—— **按子域精确切**，不整段切。
    # 这一域有 23 条端点、11 张表，一次性接完风险太大；本服务分批实现，切流也跟着分批：
    # 已切的子域列在下面，未接的仍走平台侧（网关 404 回退兜住）。
    #   已切 monitoring 子域：告警列表与处置、流通异常分页与处理、风险分布、监控指标
    #   已切 compliance 子域：投入品合规台账与处罚、标签合规与整改、标准库/校验项/汇总/执行校验
    #   已切 trust-label 子域：统计、名单分页、编辑、审核
    #   已切 cold-chain 子域：统计、资源分页、撮合记录分页、立即撮合、加入队列
    #   ✅ 至此这一域 23 条端点**全部**由 agri-production 服务，回退只作为兜底保留。
    location ~ ^/api/v1/production/admin/food-safety/(alerts|circulation|risk-distribution|metrics|compliance|trust-label|cold-chain)(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    location ~ ^/api/v1/production/admin/approvals(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    location ~ ^/api/v1/production/admin/reports(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    # 运营端「农场监管」的**合规三条**——同样只切我实现的路径，不切 /admin/farms/**：
    #   ① agri-production 里 `/admin/farms` 下还有一批上一代脚手架（PUT /{id} 掩着 PUT、{id} 把
    #      /cert-expiring、/map 这类字面量路径当数字 id 接走 → 400/405），整段切会把页面打碎；
    #   ② /compliance（农场合规画像清单）与 /compliance 的 POST（发起抽查）本服务未实现，
    #      必须留在平台侧 —— 用精确路径切就不会把它们带走。
    location ~ ^/api/v1/production/admin/farms/compliance/checks(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    location ~ ^/api/v1/production/admin/farms/compliance/[^/]+$ {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    # 农场合规画像：farmId 限定为数字，避免把 /farms/cert-expiring、/farms/map 这类字面量路径吃掉
    location ~ ^/api/v1/production/admin/farms/[0-9]+/compliance$ {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    location ~ ^/api/v1/production/admin/dashboard(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    location ~ ^/api/v1/production/admin/knowledge(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    location ~ ^/api/v1/production/admin/sop(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    location ~ ^/api/v1/production/admin/alerts(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    location ~ ^/api/v1/production/admin/alerts/[0-9]+/close$ {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @prod_platform_fallback;
        add_header X-Served-By "agri-production" always;
    }

    # 生产域里还没切过来的路径段，仍由平台侧服务（迁移期的默认）
    location /api/v1/production/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By "core-platform" always;
    }

    # 其余 /api（平台侧通用路径等）继续走 core-platform
    location /api/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 回退：前端路由（/admin/... 等）在服务端并不存在对应文件，交给指针指向的 index.html 自行处理。
    # 刻意**不写** `$uri/` 这个候选：根路径 `/` 会命中桶目录本身（是个目录），再走目录索引——
    # 而本配置没有 `index` 指令，结果是 403（目录索引禁止），站点根直接打不开。
    # 只用 `$uri` 做文件匹配，目录一律落到入口文件。
    location / {
        try_files $uri /prod/index.html;
    }
}
