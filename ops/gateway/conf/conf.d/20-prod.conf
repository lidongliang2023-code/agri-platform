# 生产管理系统（prod）—— 本地形态
#
# 生产环境的 server_name 应为 prod.agri-platform.com；本地用 agri.local 后缀（见《网关与域名规划》第一节）。
# 这里额外挂了 localhost / 127.0.0.1：这样**不用改 hosts** 也能在浏览器里验证同一套路由，
# 而 Host 路由本身仍可用 `curl -H "Host: prod.agri.local"` 单独验到（未注册 Host 由 00-default.conf 返回 404）。
server {
    listen 80;
    server_name prod.agri.local localhost 127.0.0.1;

    # 桶根：<app>/index.html 是当前版本指针，<app>/versions/<v>/ 是不可变产物
    root bucket;

    # 入口与清单必须短缓存：否则切了版本指针，用户仍旧拿到旧入口（V2.0 4.7 的灰度前提）
    location = /prod/index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /prod/manifest.json {
        add_header Cache-Control "no-store" always;
    }

    # 版本目录内容不可变，可以长缓存
    location /prod/versions/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 前端与 API 同域（《网关与域名规划》第二节约定 1）：/api 走上游，其余按 SPA 规则回退。
    # 同域的意义是浏览器侧没有跨域、Cookie 作用域最简 —— 上一轮的 HttpOnly 刷新令牌正是靠这条约定
    # 才能在开发期不经任何 CORS 配置就工作。

    # ---------------------------------------------------------------------
    # 统一认证与平台域：**永远**走 core-platform。
    #
    # 这三段显式写出来，而不是靠"/api/ 恰好指向 core_platform"这个巧合：
    # 生产域一旦切到独立的 agri-production，这几段仍必须留在平台侧 ——
    # agri-production 没有 /api/v1/auth（实测 404），切流当天登录会跟着一起断；
    # /api/v1/admin 是平台域（角色、权限、租户绑定），从来不属于生产域。
    # 前缀 location 之间按"最长匹配"生效，与书写顺序无关。
    # ---------------------------------------------------------------------
    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/admin/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------
    # 生产域（/api/v1/production/**）——**当前仍走 core-platform**。
    #
    # 切流清单（2026-10-14 实测，脚本 scripts/probe-frontend-api.mjs，可复跑）：
    #   前端 api 层共发出 311 条去重请求：
    #     core-platform（现在）：无处理器 0 条、探测成功 102 条
    #     agri-production(8092)：**无处理器 226 条**、探测成功仅 13 条
    #   —— 也就是说，此刻把这一整段切到 8092，会碎掉约四分之三的页面，
    #   而且用户端与运营端会各自看到不同来源的数据（两个库的演示数据是两套）。
    #
    #   用户端缺口（按路径段）：iot 18、members 13、analytics 12、trace 11、ai 10、
    #     blockchain 8、growth 8、quality 8、harvests 7、inputs 7、messages 6、plots 6、
    #     alerts 5、settings 5、farms 4、roles 3；plans 与 tasks 已归零。
    #   运营端 /admin/** 整段尚未实现（dashboard / approvals / food-safety / trace /
    #     quality / reports / monitor / sop / knowledge 等）。
    #
    #   切的判据：probe 脚本 A 类（"后端没有这个处理器"）归零，再改下面这一行
    #   proxy_pass 为 http://agri_production; 即可 —— 只动一处，认证与平台域不受影响。
    # ---------------------------------------------------------------------
    location /api/v1/production/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余 /api（平台侧通用路径等）继续走 core-platform
    location /api/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 回退：前端路由（/admin/... 等）在服务端并不存在对应文件，交给指针指向的 index.html 自行处理。
    # 刻意**不写** `$uri/` 这个候选：根路径 `/` 会命中桶目录本身（是个目录），再走目录索引——
    # 而本配置没有 `index` 指令，结果是 403（目录索引禁止），站点根直接打不开。
    # 只用 `$uri` 做文件匹配，目录一律落到入口文件。
    location / {
        try_files $uri /prod/index.html;
    }
}
