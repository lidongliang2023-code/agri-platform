# 生产管理移动端独立入口（:8180）。
#
# 使用独立 `bucket/prod-mobile` 版本目录，但本端口只承载移动端，
# 不再 302 到生产 PC 登录页。移动端认证调用站内独立登录接口，不受 OIDC
# redirect_uri 白名单影响。
server {
    listen 8180;
    server_name user.agri.local 127.0.0.1 localhost 192.168.0.106;

    root bucket;

    location = / {
        return 302 /prod-mobile/;
    }

    location = /prod-mobile/index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /prod-mobile/manifest.json {
        add_header Cache-Control "no-store" always;
    }

    location /prod-mobile/versions/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /prod-mobile/ {
        try_files $uri $uri/ /prod-mobile/index.html;
    }

    # 生产域接口只转发生产模块，避免 /api/ 兜底误把请求送到平台侧。
    location ~ ^/api/v1/production/(plans|inputs|tasks|quality|harvests|trace|blockchain|messages|members|alerts|settings|growth|analytics|iot|ai|farms|plots|crops|food-safety|mobile)(/|$) {
        proxy_pass http://agri_production;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
