# 仅将明确登记的移动同源地址映射为回环网关来源；其他来源原样校验。
map $http_origin $production_mobile_origin {
    default $http_origin;
    "http://user.agri.local:8180" "http://localhost:8180";
}
# 生产管理移动端同源入口（:8180）。
# 移动端只保留 uni-app 一套（H5 / 微信小程序 / APP）：H5 产物托管在 prod-mobile/ 桶；
# 旧版独立移动 H5 已下线，这里只为 uni-app web-view 内嵌的完整业务页保留
# /mobile/session 票据交接与 /production、/admin/production 业务路由（纯内容模式）。
# API 转发到已验收的 PC 网关矩阵，不复制第二份容易漂移的路径清单。
server {
    listen 8180;
    server_name user.agri.local 127.0.0.1 localhost 192.168.0.106;
    root bucket;
    location = / { return 302 /prod-mobile/; }
    location = /prod-mobile { return 302 /prod-mobile/; }
    # 旧版移动登录书签统一回到 uni-app 客户端
    location = /mobile/login { return 302 /prod-mobile/; }
    location = /prod-mobile/index.html { add_header Cache-Control "no-store" always; }
    location = /prod-mobile/manifest.json { add_header Cache-Control "no-store" always; }
    location /prod-mobile/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /prod-mobile/ {
        try_files $uri /prod-mobile/index.html;
        add_header Cache-Control "no-store" always;
    }
    location = /prod/index.html { add_header Cache-Control "no-store" always; }
    location = /prod/manifest.json { add_header Cache-Control "no-store" always; }
    location /prod/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /api/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host localhost;
        proxy_set_header Origin $production_mobile_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Merchant-Id $http_x_merchant_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        access_log off;
    }
    location /uploads/ { proxy_pass http://127.0.0.1:80; proxy_set_header Host localhost;
        proxy_set_header Origin $production_mobile_origin; }
    location /api/ai/ { proxy_pass http://127.0.0.1:80; proxy_set_header Host localhost;
        proxy_set_header Origin $production_mobile_origin; proxy_read_timeout 90s; }
    # 其余路径（/mobile/session、/production/**、/admin/production/**）是 uni-app 内嵌的业务页
    location / { try_files $uri /prod/index.html; add_header Referrer-Policy "no-referrer" always; }
}
