# 用户端独立入口（生产管理系统 · 用户端）
#
# 背景：同一个前端产物里同时承载用户端（/production/*）与运营端（/admin/production/*）。
# 运营端已经有一个独立入口（70-admin-entry.conf，:8190 根路径直接落 /admin/login）；
# 用户端此前**只有 :80 的根路径**，而根路径交给 SPA 自己决定去哪 —— 用运营账号登录时会被带到运营端，
# 于是"点用户端入口进的是运营端"。这里按与运营端完全对称的方式补一个独立入口：
# 根路径直接落到用户端登录页，不再依赖账号角色去猜。
#
# 与 prod vhost（:80）的关系：桶与版本指针**完全共用**（同一份产物、同一个指针），
# 只是"根路径去哪"不同 —— 不是第二套部署，回滚与版本指针仍然只有一处。
server {
    listen 8180;
    server_name user.agri.local 127.0.0.1 localhost;

    root bucket;

    # 用户端入口：根路径直接进用户端登录页
    location = / {
        return 302 /production/login;
    }

    location = /prod/index.html { add_header Cache-Control "no-store" always; }
    location = /prod/manifest.json { add_header Cache-Control "no-store" always; }
    location /prod/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # /api 交给 prod vhost（:80）处理：切流矩阵（哪些段走 agri-production、哪些留平台侧）
    # 只存在于那一份 server 块里，这里复制一份就会变成"两个入口两份数据"。
    # Host 必须改写成 prod vhost 认得的名字（它只认 prod.agri.local / localhost / 127.0.0.1），
    # 否则会落到 00-default.conf 的 404。
    location /api/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri /prod/index.html; }
}
