# 用户端入口（生产管理系统 · 用户端）：好记的端口 → **整站 302 到 :80**
#
# 背景与教训（2026-10-16 实测）：
# ① 用户端此前只有 :80 的根路径，而根路径交给 SPA 按账号角色决定去哪 —— 用运营账号登录会被带到运营端，
#    表现为"点用户端入口进的是运营端"。所以需要一个"一进去就是用户端"的入口。
# ② 但**不能**在本端口直接跑应用：平台的 SSO 客户端注册表（core-platform 的 application-dev.yml，
#    `agri.sso.clients.prod`）是一份 **redirect_uri 前缀白名单**，只登记了不带端口的 `http://localhost/`
#    与运营端的 `http://localhost:8190/`（当年开运营端入口时加的，注释里还写明"前缀匹配，http://localhost/
#    只覆盖 :80，不含带端口的地址"）。:8180 不在其中 → 打开登录页时 SPA 会把 SSO 回调拼成
#    `http://localhost:8180/sso/callback`，认证中心判「redirect_uri 不在白名单」，页面直接显示一段 JSON。
# ③ 把 :8180 加进白名单要走"改 core-platform 配置 → 重建 → 重启平台服务"，代价与风险都高于收益；
#    而需求只是"有个一进去就是用户端的好记入口"。所以这里让 :8180 **整站 302 到 :80**：
#    应用与 SSO 回调都发生在白名单覆盖的 :80 上，同时深链（/production/**）原样保留。
#
# 若将来确实要 :8180 自己承载应用：把 `http://localhost:8180/` 与 `http://127.0.0.1:8180/`
# 加进那份白名单，重建并重启 core-platform，再把这里换回"本地服务 + /api 回环代理"的写法。
server {
    listen 8180;
    server_name user.agri.local 127.0.0.1 localhost;

    # 根路径：直接进用户端登录页（在 :80 上打开）
    location = / {
        return 302 http://localhost/production/login;
    }

    # 其余路径（含深链与 SSO 回调）原样搬到 :80，保证 origin 落在白名单内
    location / {
        return 302 http://localhost$request_uri;
    }
}
