# 统一认证中心（sso 子域）—— 本地形态
#
# 生产：sso.agri-platform.com；本地按既有约定用 :8090（免 hosts 用 http://localhost:8090/）。
#
# 这个 vhost 与其它子系统的差别只有一处：**多了一条 /authorize 的短路径**。
# 授权端点在 OIDC 惯例里是干净路径（子系统要把浏览器整页送过来），
# 而我们的后端统一挂在 /api/v1 下，所以在这里做一次路径映射，而不是把 /api/v1/sso/authorize
# 这个地址写进每个子系统的跳转代码里。
server {
    listen 8090;
    server_name sso.agri.local 127.0.0.1 localhost;

    root bucket;

    location = /sso/index.html { add_header Cache-Control "no-store" always; }
    location = /sso/manifest.json { add_header Cache-Control "no-store" always; }
    location /sso/versions/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # 授权端点：子系统把浏览器送到这里（带 client_id/redirect_uri/state/PKCE）
    location = /authorize {
        proxy_pass http://core_platform/api/v1/sso/authorize$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登录页自己调用的接口（login / token / logout）走常规 /api 前缀
    location /api/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 回退：/login?<原始授权参数> 由登录页自己解析
    location / { try_files $uri /sso/index.html; }
}
