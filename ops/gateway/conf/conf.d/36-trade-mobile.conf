# 交易撮合独立移动端（:8181）。
#
# 与 :8086 的交易 PC/会员中心共享交易后端和 SSO，但前端产物来自独立
# agri-trade/mobile 工程与 bucket/trade-mobile 版本目录，可独立发布和回滚。
server {
    listen 8181;
    server_name trade-mobile.agri.local 127.0.0.1 localhost 192.168.0.106;
    client_max_body_size 10m;

    root bucket;

    location = /trade-mobile/index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /trade-mobile/manifest.json {
        add_header Cache-Control "no-store" always;
    }
    location /trade-mobile/versions/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/trade/ {
        proxy_pass http://trade_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/platform/identity/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/platform/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/admin/user-merchants {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/trade/ {
        proxy_pass http://trade_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://trade_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /trade-mobile/index.html;
    }
}
