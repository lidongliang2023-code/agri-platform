# 交易撮合独立移动端（:8181）。
#
# 与 :8086 的交易 PC/会员中心共享交易后端和 SSO，前端产物来自 uni-app 工程
# agri-trade/miniprogram 的 H5 构建（同一工程另出微信小程序与 App），
# 发布到 bucket/trade-mobile 版本目录，可独立发布和回滚。
server {
    listen 8181;
    server_name trade-mobile.agri.local 127.0.0.1 localhost 192.168.0.105 192.168.0.106 192.168.11.196;
    client_max_body_size 10m;

    root bucket;

    # 首屏压缩：构建时已给 js/css/svg/json 生成 .gz（agri-trade/miniprogram/vite.config.ts），
    # gzip_static 直接发预压缩文件；其余文本（index.html、接口 JSON）按请求压缩。
    # 不开时 uni-app 主脚本按 275 KB 原样传输，慢网下白屏要多等 1 秒以上。
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /trade-mobile/index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /trade-mobile/manifest.json {
        add_header Cache-Control "no-store" always;
    }
    location /trade-mobile/versions/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/trade/ {
        proxy_pass http://trade_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/platform/identity/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/platform/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/admin/user-merchants {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/trade/ {
        proxy_pass http://trade_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://trade_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /trade-mobile/index.html;
    }
}
