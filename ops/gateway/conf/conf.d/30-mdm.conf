# 主数据管理平台（mdm）—— 本地形态
#
# 生产：mdm.agri-platform.com:443。本地这里**故意不再占用 :80**，而是听 :8080：
#   - :80 留给 prod，用来验证"同一端口按 Host 分流"；
#   - :8080 让浏览器可以直接 http://localhost:8080/ 打开本应用，**不需要改 hosts** 就能看效果。
# Host 形式（mdm.agri.local）同样可用，用 curl -H 即可验，与生产口径一致。
server {
    listen 8080;
    server_name mdm.agri.local 127.0.0.1 localhost;

    root bucket;

    location = /mdm/index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /mdm/manifest.json {
        add_header Cache-Control "no-store" always;
    }
    location /mdm/versions/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 每个子系统接自己的 API 上游（《网关与域名规划》第二节：API 上游 = core-platform 或对应 satellite）。
    # 主数据域的后端目前本地未运行，因此这里预期返回 502 —— 那恰好说明网关**路由到了正确的上游**，
    # 而不是把请求吞掉或回 404。后端起来后无需改配置。
    #
    # 2026-10-12 补：实测发现后端真正注册的接口族是 **/admin/masterdata/***，
    # 而源码里那批 /api/master-data/* 在运行时并未注册（请求落到静态资源兜底 → 500 NoResourceFound）。
    # 所以这里按后端的真实形态转发，而不是按前端 baseURL 的猜测转发 —— 否则就是
    # 「网关能转发的恰好是后端没有的、后端有的恰好网关不转发」，页面怎么调都不通。
    location /admin/masterdata/ {
        proxy_pass http://mdm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 平台认证端口（core-platform）——**必须排在 /api/ 之前语义上更长的前缀上**，
    # 否则 SSO 换票请求会被转发到 mdm_backend，登录在第一步就断掉。
    #
    # 为什么 mdm 的页面要打 core-platform 的认证端点：
    #   1. 换票 /api/v1/sso/token —— 授权码换平台令牌，V2.0 5.2 第 ⑦ 步；
    #   2. 续签 /api/v1/auth/refresh —— 访问令牌只在内存，刷新页面靠它用 HttpOnly Cookie 换回；
    #   3. 登出 /api/v1/auth/logout —— 吊销刷新令牌并清 Cookie。
    # 这三件事都发生在"平台令牌域"，与 mdm 自己的业务接口域（/admin/masterdata/*）不是一回事。
    location /api/v1/sso/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 平台认证审核（企业与个人实名）—— 数据在 core-platform，不在主数据业务库。
    location /api/v1/admin/merchant-certifications {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/admin/user-identities {
        proxy_pass http://core_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 商品品类与违规处置属于交易域（agri-trade 的 /api/trade/admin/**）。
    # 主数据端的“商品与分类”页面直接调用这组接口；不转发的话会落到 mdm_backend 并 404。
    location /api/trade/ {
        proxy_pass http://trade_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 存量 /api/* 接口族（mdm 自身的旧接口，非 /api/v1/*）仍走 mdm_backend。
    location /api/ {
        proxy_pass http://mdm_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 同 20-prod.conf：不带 `$uri/` 候选，避免站点根命中目录后 403
    location / {
        try_files $uri /mdm/index.html;
    }
}
