# 未注册子域的兜底：直接 404。
#
# 为什么需要它：如果没有 default_server，nginx 会把任何未知 Host 都交给第一个 server 块处理，
# 于是「iot.agri.local」看起来也能打开生产管理系统的页面 —— 路由配错了却像是对的。
# 让它显式 404，配置错误就会立刻暴露，而不是等人肉核对。
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

# 本地免 hosts 用的 :8080 也需要同样的兜底，否则 :8080 上只有一个 server 块，
# 任何未知 Host 都会被它接走 —— 那就等于"这一层没有路由，只是碰巧只有一个应用"。
server {
    listen 8080 default_server;
    server_name _;
    return 404;
}

# 本地"一端一口"的其余端口同样各配一份兜底：
# 缺了它，该端口上唯一的 server 块会把任何未知 Host 都接走 —— 那一层等于没有路由。
server { listen 8081 default_server; server_name _; return 404; }
server { listen 8082 default_server; server_name _; return 404; }
server { listen 8084 default_server; server_name _; return 404; }
server { listen 8085 default_server; server_name _; return 404; }
server { listen 8090 default_server; server_name _; return 404; }
