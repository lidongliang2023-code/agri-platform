# 统一接入层（本地形态）—— 依据《网关与域名规划》第二节「网关路由矩阵」与第三节「版本指针」
#
# 启动方式（必须在 ops/gateway 作为 prefix 运行，本文件里的相对路径才成立）：
#   C:\nginx\nginx.exe -p <repo>\ops\gateway -c conf/nginx.conf
# 重载 / 停止：
#   C:\nginx\nginx.exe -p <repo>\ops\gateway -s reload | -s stop
#
# 为什么用 -p（prefix）而不是把绝对路径写进配置：配置文件要能进版本库、能被别的机器直接用。
# 绝对路径一写死，换台机器或换个 clone 目录就要改配置，改配置就有改错的机会。

worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    # 不 include 系统 mime.types：那是 nginx 安装目录里的文件，写绝对路径就把配置钉死在本机。
    # 只声明这个平台实际会产出的类型，够用且可移植。
    types {
        text/html                 html;
        text/css                  css;
        application/javascript    js mjs;
        application/json          json;
        image/svg+xml             svg;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/x-icon              ico;
        font/woff                 woff;
        font/woff2                woff2;
        text/plain                txt;
    }
    default_type application/octet-stream;

    access_log logs/access.log;
    sendfile on;
    server_tokens off;

    # 子域一多，默认 32 字节的名字哈希桶就不够用了（报 "could not build server_names_hash"，
    # 且此时**整份配置加载失败**——已监听的端口仍按旧配置服务，新端口一个都不会起来）。
    # 这不是"调大一点保险"，而是每新增若干 server_name 就可能触到的硬上限。
    server_names_hash_bucket_size 64;
    server_names_hash_max_size 512;

    # conf.d 按**文件名字典序**加载，所以用数字前缀把依赖顺序固定下来：
    #   00 兜底 server（不引用任何上游）→ 10 上游定义 → 20+ 各子系统 server（引用上游）
    # 上游必须先于引用它的 server 块出现，否则 nginx 解析到 proxy_pass 时还不知道该名字。
    include conf.d/*.conf;
}
