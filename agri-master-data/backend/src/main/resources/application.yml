server:
  port: 8081

spring:
  application:
    name: agri-masterdata
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agri_masterdata?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Agri@2024
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  redis:
    host: localhost
    port: 6379
    password:
    database: 1
    timeout: 3000ms
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.agri.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 平台访问令牌（V2.0 第 5.2/5.3 节）—— 与 core-platform 的 agri.jwt 同一份配置键。
# 生产必须由环境变量 AGRI_JWT_SECRET 注入（≥32 字符）；这里的开发默认值仅为本地可跑通。
agri:
  jwt:
    secret: ${AGRI_JWT_SECRET:agri-dev-secret-key-change-me-32bytes!}
    issuer: agri-core-platform

# 私有会话令牌（存量 /api/* 接口族的迁移窗口内兼容），与平台令牌无关。
jwt:
  secret: agri-masterdata-jwt-secret-key-2024
  expiration: 86400000

logging:
  level:
    com.agri: DEBUG
    org.springframework: INFO
