server:
  port: 8081

spring:
  application:
    name: agri-masterdata
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agri_masterdata?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Agri@2024
  sql:
    init:
      mode: always
      # 必须显式指定 UTF-8：Spring 的 spring.sql.init.encoding 默认值是**平台默认编码**，
      # 在中文 Windows 上是 GBK。schema.sql / data.sql 都是 UTF-8 文件，
      # 按 GBK 读会把所有中文变成乱码再写进库 —— 实测种子租户名被存成
      # "绯荤粺绉熸埛"（"系统租户" 的 UTF-8 字节被当 GBK 解读），且 UTF-8 无法还原的字会被
      # 替换成 U+FFFD（不可逆的数据损坏）。这个坑不报错、只在界面上表现为乱码，最难查。
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  redis:
    host: localhost
    port: 6379
    password:
    database: 1
    timeout: 3000ms
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.agri.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 平台访问令牌（V2.0 第 5.2/5.3 节）—— 与 core-platform 的 agri.jwt 同一份配置键。
# 生产必须由环境变量 AGRI_JWT_SECRET 注入（≥32 字符）；这里的开发默认值仅为本地可跑通。
agri:
  jwt:
    secret: ${AGRI_JWT_SECRET:agri-dev-secret-key-change-me-32bytes!}
    issuer: agri-core-platform

# 私有会话令牌（存量 /api/* 接口族的迁移窗口内兼容），与平台令牌无关。
jwt:
  secret: agri-masterdata-jwt-secret-key-2024
  expiration: 86400000

# 运营端准入（平台 RBAC，V2.0 第 5.5 节）。
#
# 组件来自 agri-common（com.agri.common.rbac，自动装配），这里只声明"本服务的运营接口在哪、
# 要什么权限码"：命中路径的请求按方法要读/写权限，方法上标了 @OperatorOnly 的按标注要。
# 权限码与 platform_role.permissions 同一套词表 —— 目前只有 SUPER_ADMIN 的 ["*"] 覆盖
# masterdata:*，也就是说主数据运营端默认只对超管开放；要让市场运营也能进，
# 把 masterdata:read/write 加进 MARKET_OPS 的权限即可（数据变更，不动代码）。
platform:
  rbac:
    operator-paths:
      - /admin/masterdata/**
    read-permission: masterdata:read
    write-permission: masterdata:write
    # 本服务自己有认证层（com.agri.common.security.AuthenticationInterceptor，
    # 由 com.agri.common.config.WebMvcConfig 注册：先验平台访问令牌、再退回私有会话令牌）。
    # 实测不带令牌调 /admin/masterdata/standard/dict/list 会被它挡住，返回体的业务码是
    # "用户未登录"（注意 HTTP 状态是 200 —— 这个模块用"HTTP 200 + 业务码"表达失败，
    # 别把 200 当成放行）。
    # 既然认证已经有人管，这里打开 require-auth 纯属纵深防御：万一哪天那个拦截器被摘掉，
    # 运营接口不会跟着变成敞开的。
    require-auth: true

# 平台认证中心地址（RBAC 权限解析与将来的其它平台调用都走它）
services:
  platform:
    url: http://localhost:8093

logging:
  level:
    com.agri: DEBUG
    org.springframework: INFO
