version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: agri-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: agri@123
      MYSQL_DATABASE: agri_platform
      MYSQL_CHARSET: utf8mb4
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  redis:
    image: redis:7.2
    container_name: agri-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: agri-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: agri@123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

  minio:
    image: minio/minio:latest
    container_name: agri-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: agri@123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  auth-service:
    build:
      context: ../agri-auth
      dockerfile: Dockerfile
    container_name: agri-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/agri_platform
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: agri@123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    restart: always

  production-service:
    build:
      context: ../agri-production/backend
      dockerfile: Dockerfile
    container_name: agri-production-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/agri_platform
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: agri@123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    restart: always

  iot-service:
    build:
      context: ../agri-iot/backend
      dockerfile: Dockerfile
    container_name: agri-iot-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/agri_platform
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: agri@123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    restart: always

  trade-service:
    build:
      context: ../agri-trade/backend
      dockerfile: Dockerfile
    container_name: agri-trade-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/agri_platform
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: agri@123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    restart: always

  ai-service:
    build:
      context: ../agri-ai
      dockerfile: Dockerfile
    container_name: agri-ai-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AI_TONGYI_API-KEY: ${TONGYI_API_KEY}
      AI_OPENAI_API-KEY: ${OPENAI_API_KEY}
      AI_PROVIDER: tongyi
    depends_on:
      - redis
    restart: always

  masterdata-service:
    build:
      context: ../agri-master-data/backend
      dockerfile: Dockerfile
    container_name: agri-masterdata-service
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/agri_platform
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: agri@123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    restart: always

  nginx:
    image: nginx:latest
    container_name: agri-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - auth-service
      - production-service
      - iot-service
      - trade-service
      - ai-service
      - masterdata-service
    restart: always

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data: