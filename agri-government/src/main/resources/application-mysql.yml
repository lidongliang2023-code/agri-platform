spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AGRI_GOVERNMENT_DB_URL:jdbc:mysql://localhost:3306/agri_government?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${AGRI_GOVERNMENT_DB_USERNAME:root}
    password: ${AGRI_GOVERNMENT_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql,classpath:schema-mysql.sql
      data-locations: classpath:data.sql
