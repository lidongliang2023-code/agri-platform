server:
  port: ${SERVER_PORT:8204}

spring:
  application:
    name: satellite-quote-push

agri:
  push:
    core-base-url: ${CORE_BASE_URL:http://localhost:8080}
    poll-interval-ms: 3000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{40} - %msg%n"

# Unified probes: dependency failures affect readiness, not liveness.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: '*'
          exclude: livenessState
