server:
  port: 8084

spring:
  application:
    name: satellite-gov-exchange
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/agri_gov?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

agri:
  gov:
    # 单向导出目录（生产 = 网闸前置机挂载目录）
    export-dir: ${GOV_EXPORT_DIR:./gov-outbox}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{40} - %msg%n"
