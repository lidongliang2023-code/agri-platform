agri:
  sso:
    # 本地开发口径的 SSO 客户端注册表（生产用 application-prod.yml 或环境变量覆盖）。
    #
    # 为什么写在这里而不是只放在 SsoProperties 的代码默认值里：注册表按 client_id →
    # 允许的 redirect_uri 前缀白名单匹配，**没登记的子系统连登录页都进不去**
    # （未注册会被直接 400：`未注册的 client_id`；前缀不匹配则是
    # `redirect_uri 不在白名单`）。把它显式写进 dev 配置，新增子系统时改动看得见、
    # 也不用去翻 Java 默认值。
    #
    # 注意：yaml 里一旦给出 clients，就会**整份替换**代码里的默认表 —— 所以这里必须
    # 把四个端都列全，漏掉哪个哪个就登不上。
    clients:
      prod:
        - http://localhost/
        - http://127.0.0.1/
        - http://localhost:5173/
        - http://prod.agri.local/
      mdm:
        - http://localhost:8080/
        - http://mdm.agri.local/
      finance:
        - http://localhost:8081/
        - http://finance.agri.local/
      trade:
        - http://localhost:8086/
        - http://localhost:3002/
        - http://trade.agri.local/

logging:
  level:
    com.agri: debug
    org.springframework.web: info
