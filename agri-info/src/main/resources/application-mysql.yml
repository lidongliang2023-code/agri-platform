spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AGRI_INFO_DB_URL:jdbc:mysql://localhost:3306/agri_info?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${AGRI_INFO_DB_USERNAME:root}
    password: ${AGRI_INFO_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false

logging:
  level:
    com.agri.info: INFO
