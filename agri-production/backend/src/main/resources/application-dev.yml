spring:
  datasource:
    url: jdbc:sqlite:./data/example_db.sqlite
    username: admin
    password: password
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-sqlite.sql

services:
  iot:
    url: localhost:8083
  masterdata:
    url: localhost:8084

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.agri.production.entity
  global-config:
    db-config:
      id-type: auto
      table-underline: true