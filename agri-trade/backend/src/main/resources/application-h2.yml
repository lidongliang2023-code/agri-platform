server:
  port: 8082

spring:
  application:
    name: agri-trade
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:agri_trade;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  redis:
    host: localhost
    port: 6379
    password:
    database: 2
    timeout: 3000ms
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.agri.trade.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: agri-trade-jwt-secret-key-2024
  expiration: 86400000

logging:
  level:
    com.agri.trade: DEBUG
    org.springframework: INFO

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

services:
  masterdata:
    url: http://localhost:8080
  production:
    url: http://localhost:8081