server:
  # 8084 不能用：nginx 的 mall-supplier 虚拟主机就听在 8084
  # （见 ops/gateway/conf/conf.d/40-vue-apps.conf），后端再绑这个端口只会
  # "Web server failed to start. Port 8084 was already in use"。
  # 8089 在网关与各子系统后端里都没人占用。
  port: 8089

spring:
  application:
    name: agri-trade
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  profiles:
    # 默认走 MySQL —— 平台基线：九个前台共用一个 MySQL 实例、各用各的库（架构文档 V2.0）。
    #
    # 原先这里默认 h2 内存库、而且下面的 sql.init.mode=never：那套组合下**一张表都不会建**，
    # 应用能正常启动、任何接口都报 "Table doesn't exist"，等于跑了一个空壳。
    # 需要脱离 MySQL 单跑时用 --spring.profiles.active=h2（application-h2.yml 保留着）。
    active: mysql
  sql:
    init:
      mode: always
      # 必须显式指定 UTF-8：spring.sql.init.encoding 默认取**平台默认编码**，
      # 中文 Windows 上是 GBK。schema.sql 是 UTF-8 文件，按 GBK 读会把中文注释写成乱码。
      encoding: UTF-8
      schema-locations: classpath:schema.sql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agri_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.agri.trade.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: agri-trade-jwt-secret-key-2024
  expiration: 86400000

# 平台访问令牌（架构文档 V2.0 第 5.2/5.3 节）——与 core-platform 的 agri.jwt 同一份配置键，
# 只有同键同密钥，SSO 签发的令牌在本模块才验得过签。上面那个 `jwt.secret` 是交易模块自己的
# 私有密钥（历史遗留，当前没有代码在用它签发/校验），与平台令牌是两套东西，不要混用。
agri:
  jwt:
    secret: ${AGRI_JWT_SECRET:agri-dev-secret-key-change-me-32bytes!}
    issuer: agri-core-platform
  trade:
    settlement:
      # 平台服务费率，按**货款**计（不含运费）。卖家应收 = 订单总额 − 平台服务费。
      # 结算是运营端的显式动作（POST /api/trade/admin/settlement/{orderId}/settle），
      # 不做定时自动打款 —— 涉及钱的动作不该在没人看着的时候自己跑。
      # 这里的默认值只是开发用；正式环境应由运营给定并经环境变量注入。
      #
      # 注意别和 core-platform 里那个同名配置搞混：那边的 agri.trade.settlement
      # 是平台内部交易面（mod-trade）自己一套订单表用的，与本模块的订单不是同一套数据。
      platform-fee-rate: ${AGRI_TRADE_SETTLEMENT_FEE_RATE:0.005}

logging:
  level:
    com.agri.trade: DEBUG
    org.springframework: INFO

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

services:
  platform:
    # core-platform：身份解析（当前用户 -> 经营主体）走它的 /api/v1/platform/merchants/mine。
    # 为什么不在交易模块直连平台库取绑定关系：架构文档 V2.0 要求跨域取数走接口，
    # 否则平台一旦换库/拆库，交易模块会跟着一起崩。
    url: http://localhost:8093
  masterdata:
    # 主数据域后端实际跑在 8083（与 ops/gateway 的 upstream mdm_backend 一致）。
    # 原先写 8081 是照抄另一套端口的残留：8081 现在是 nginx 给 agri-finance 的前端虚拟主机，
    # 拿它当主数据接口地址只会把 Feign 调用打到网关的静态站点上。
    url: http://localhost:8083
  production:
    # 生产管理域后端跑在 8082（见 agri-production/backend/src/main/resources/application.yml）。
    # 原先写 8083 —— 那是主数据域后端的端口，等于把两个域的服务地址都指错了。
    url: http://localhost:8082

# 运营端准入（平台 RBAC，V2.0 第 5.5 节）—— 由 agri-common 里的
# OperatorGuardInterceptor 自动装配后生效，这里只声明"本服务的运营接口在哪、要什么权限码"：
#   · /api/trade/admin/** ：运营端各页面的接口族，GET 要 trade:read、写要 trade:write；
#   · 方法上标了 @OperatorOnly 的：按标注要权限（退款审核、纠纷调解/仲裁、赔付审核与打款等
#     挂在业务路径上的运营动作 —— 这些不可能都挪到 /admin 下，只按前缀拦会漏掉最要命的口子）。
# 权限码与 platform_role.permissions 同一套词表，按令牌 + 当前市场实时解析（不是令牌摘要）。
platform:
  rbac:
    operator-paths:
      - /api/trade/admin/**
    read-permission: trade:read
    write-permission: trade:write
    # 交易模块自己有认证拦截器（WebMvcConfig 注册的 AuthenticationInterceptor，
    # 不带令牌访问运营接口实测 401），所以这里默认 false 也够用。
    # 仍然显式打开：一旦哪天那个拦截器被摘掉或改了白名单，运营接口不会跟着变敞开 ——
    # 纵深防御，代价是"多一次前置校验"。
    require-auth: true
